spring:
  application:
    name: platform-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PLATFORM_API_PORT:8080}
agent-studio:
  setup-token: ${SETUP_TOKEN:}
  encryption-key: ${ENCRYPTION_KEY:}
  agent-worker-token: ${AGENT_WORKER_TOKEN:}
  browser-worker-token: ${BROWSER_WORKER_TOKEN:}
  agent-worker-base-url: ${AGENT_WORKER_BASE_URL:http://agent-worker:8082}
  object-store:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:true}
