spring:
  application:
    name: platform-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
server:
  port: ${PLATFORM_API_PORT:8080}
agent-studio:
  setup-token: ${SETUP_TOKEN:}
  encryption-key: ${ENCRYPTION_KEY:}
  agent-worker-token: ${AGENT_WORKER_TOKEN:}
  browser-worker-token: ${BROWSER_WORKER_TOKEN:}
  agent-worker-base-url: ${AGENT_WORKER_BASE_URL:http://agent-worker:8082}
  workflow-service-base-url: ${WORKFLOW_SERVICE_URL:${WORKFLOW_SERVICE_BASE_URL:http://workflow-service:8081}}
  workflow-service-token: ${WORKFLOW_SERVICE_TOKEN:}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8088}
  mail-from: ${MAIL_FROM:no-reply@sourcewright.local}
  object-store:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:true}
  git:
    allowed-hosts: ${GIT_ALLOWED_HOSTS:github.com,gitlab.com,bitbucket.org}
    max-archive-bytes: ${GIT_MAX_ARCHIVE_BYTES:104857600}
    max-files: ${GIT_MAX_FILES:20000}
    timeout-seconds: ${GIT_TIMEOUT_SECONDS:90}
