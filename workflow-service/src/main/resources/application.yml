spring:
  application:
    name: workflow-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${WORKFLOW_SERVICE_PORT:8081}
  max-http-request-header-size: 16KB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
