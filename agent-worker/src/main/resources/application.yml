server:
  port: ${AGENT_WORKER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Required runtime values are intentionally unresolved here. AgentWorkerSecurityConfiguration
# fails application startup when any credential or service URL is absent.
agent-worker:
  platform-api-url: ${PLATFORM_API_URL}
  browser-worker-url: ${BROWSER_WORKER_URL}
