openapi: 3.1.0
info:
  title: Sourcewright API
  version: 0.1.0
  description: >-
    Task API contract. Authentication and authorization are implemented by platform-api.
    Screenshot tasks require an explicit application baseUrl in parameters; login profile URLs
    are used only for authentication and are never treated as the application entry point.
paths:
  /v1/tasks:
    post:
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '202':
          description: Task accepted, or the task previously accepted for this idempotency key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSnapshot' }
  /v1/tasks/{taskId}:
    get:
      operationId: getTask
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      responses:
        '200': { description: Task state, content: { application/json: { schema: { $ref: '#/components/schemas/TaskSnapshot' } } } }
        '404': { description: Task not found or unavailable to the caller }
  /v1/tasks/{taskId}/events:
    get:
      operationId: streamTaskEvents
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Server-sent task events, ordered by per-task sequence.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/TaskEvent' }
  /v1/tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
      parameters: [ { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '202': { description: Cancellation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/TaskSnapshot' } } } }
components:
  parameters:
    TaskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
  schemas:
    TaskType: { type: string, enum: [PROJECT_DOCS, USER_GUIDE, HTML, SCREENSHOT] }
    TaskStatus: { type: string, enum: [QUEUED, RUNNING, PAUSED, WAITING_FOR_APPROVAL, SUCCEEDED, FAILED, CANCELED] }
    CreateTaskRequest:
      type: object
      required: [projectId, type, templateVersionId, parameters]
      dependentRequired:
        providerProfileId: [modelId]
        modelId: [providerProfileId]
      properties:
        projectId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TaskType' }
        templateVersionId:
          type: string
          format: uuid
          description: Immutable template version selected for this task.
        parameters:
          type: object
          maxProperties: 100
          description: Parameter values validated against the selected template-version schema; serialized parameters must not exceed 65536 bytes. SCREENSHOT tasks must include an HTTP(S) baseUrl for the application under test.
          additionalProperties: true
          properties:
            baseUrl:
              type: string
              format: uri
              pattern: '^https?://[^#]+$'
              description: Application entry URL used after login; keep login page configuration in the selected login profile.
        providerProfileId:
          type: string
          format: uuid
          description: Optional caller-owned provider profile. Omit with modelId to use the caller's personal default.
        modelId:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          maxLength: 255
          description: Optional model identifier, supplied only with providerProfileId.
    TaskSnapshot:
      type: object
      required: [taskId, projectId, type, status, createdAt, updatedAt]
      properties:
        taskId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TaskType' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resultReference: { type: [string, 'null'] }
        failureCode: { type: [string, 'null'] }
    TaskEvent:
      type: object
      required: [taskId, sequence, status, occurredAt]
      properties:
        taskId: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/TaskStatus' }
        occurredAt: { type: string, format: date-time }
        resultReference: { type: [string, 'null'] }
        failureCode: { type: [string, 'null'] }
